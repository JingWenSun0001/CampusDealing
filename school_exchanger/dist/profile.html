<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>我的 - 校小易</title>
<style>
:root{--ink:#1d1d1f;--muted:#86868b;--line:#e5e5ea;--paper:#fff;--bg:#f5f5f7;--blue:#007aff;--soft:#f0f7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}.page{width:min(100%,430px);min-height:100vh;margin:auto;padding:22px 16px 100px;background:var(--paper)}.view{display:none}.view.show{display:block}.top{height:42px;display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.top h1{font-size:24px;margin:0}.top h2{font-size:19px;margin:0}.back,.edit{border:1px solid var(--line);background:#fff;border-radius:12px;height:38px;padding:0 13px;color:var(--ink);font-size:14px}.back{width:38px;padding:0;font-size:23px}.edit{color:var(--blue);border-color:transparent;background:var(--soft)}.profile-head{display:flex;align-items:center;gap:13px;margin:3px 2px 22px}.avatar{width:58px;height:58px;border:0;border-radius:50%;display:grid;place-items:center;background:#edf4ff;color:var(--blue);font-size:24px;font-weight:700;cursor:pointer;background-size:cover;background-position:center}.profile-copy b,.profile-name{font-size:18px}.profile-name{border:0;background:none;padding:0;color:var(--ink);font-weight:700;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.stat{min-height:82px;border:1px solid var(--line);border-radius:15px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.stat.active{border-color:#b9d8ff;background:var(--soft)}.stat:active{background:var(--soft)}.stat b{font-size:22px;color:var(--blue)}.stat span{margin-top:5px;color:var(--muted);font-size:11px}.card{border:1px solid var(--line);border-radius:16px;background:#fff}.info-card{padding:5px 17px 6px}.line{min-height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}.line:last-child{border-bottom:0}.line label{color:var(--muted);font-size:13px}.line input{width:210px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ink);font:inherit;text-align:right;padding:9px 7px;outline:none}.line input.editing{border-color:#b9d8ff;background:#f8fbff}.save{display:none;width:100%;margin-top:14px;border:0;border-radius:13px;background:var(--blue);color:#fff;padding:13px;font-size:15px}.save.show{display:block}.task-list{display:grid;gap:9px;margin-top:18px}.task-item{display:block;border:1px solid var(--line);border-radius:15px;padding:12px 15px;background:#fff;color:inherit;text-decoration:none}.task-item-top{display:flex;justify-content:space-between;gap:8px}.task-item b{font-size:14px}.task-item small,.task-item p{color:var(--muted);font-size:11px}.task-item p{margin:6px 0 0}.empty{padding:35px 12px;text-align:center;color:var(--muted);font-size:12px;background:#fafafa;border-radius:14px}.bottom{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,430px);height:76px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid rgba(229,229,234,.9);display:flex;justify-content:space-around;align-items:center;padding:7px 54px 8px}.nav-item,.nav-add{border:0;background:none;color:var(--muted);font-size:10px;text-decoration:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:42px}.nav-item.active{color:var(--blue);font-weight:700}.nav-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav-add{width:48px;height:48px;min-width:48px;justify-content:center;border-radius:50%;background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(0,122,255,.28);margin-top:-19px;border:4px solid var(--paper)}.nav-add svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
</style></head>
<body>
<main class="page"><section class="view show" id="overview"><div class="profile-head"><button class="avatar" id="avatarButton" type="button">林</button><input id="avatarInput" type="file" accept="image/*" hidden><div class="profile-copy"><button class="profile-name" id="profileName" type="button">林同学</button></div></div><div class="stats"><button class="stat active" data-kind="published" type="button"><b>0</b><span>我发布的</span></button><button class="stat" data-kind="seeking" type="button"><b>0</b><span>我求助的</span></button><button class="stat" data-kind="joined" type="button"><b>0</b><span>我参与的</span></button></div><div class="task-list" id="overviewTaskList"></div></section>
<section class="view" id="infoView"><header class="top"><button class="back" id="infoBack" type="button">‹</button><h2>我的信息</h2><button class="edit" id="editInfo" type="button">编辑</button></header><div class="card info-card"><div class="line"><label>姓名</label><input id="name" value="林同学" disabled></div><div class="line"><label>学号</label><input id="studentId" value="20****018" disabled></div><div class="line"><label>宿舍楼</label><input id="building" value="3号楼" disabled></div><div class="line"><label>宿舍号</label><input id="room" value="521" disabled></div></div><button class="save" id="saveInfo" type="button">保存信息</button></section></main>
<nav class="bottom"><a class="nav-item" href="index.html"><svg viewBox="0 0 24 24"><path d="M3.5 10.8 12 3.9l8.5 6.9v8.1a1.2 1.2 0 0 1-1.2 1.2H4.7a1.2 1.2 0 0 1-1.2-1.2z"/><path d="M9.3 20.1v-5.8h5.4v5.8"/></svg><span>首页</span></a><a class="nav-add" href="publish.html"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></a><a class="nav-item active" href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.2 20c.9-3.3 3.1-5 6.8-5s5.9 1.7 6.8 5"/></svg><span>我的</span></a></nav>
<script src="api.js"></script><script>
const overview=document.getElementById('overview'),infoView=document.getElementById('infoView'),inputs=[...infoView.querySelectorAll('input')],editInfo=document.getElementById('editInfo'),saveInfo=document.getElementById('saveInfo'),stats=[...document.querySelectorAll('.stat b')],statButtons=[...document.querySelectorAll('.stat')],taskList=document.getElementById('overviewTaskList'),avatarButton=document.getElementById('avatarButton'),avatarInput=document.getElementById('avatarInput');let mine=[],allPosts=[];
function readJson(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function showOnly(v){[overview,infoView].forEach(x=>x.classList.remove('show'));v.classList.add('show')}
function applyStats(d){stats[0].textContent=d.selling||mine.filter(x=>x.intent==='offer').length;stats[1].textContent=d.seeking||mine.filter(x=>x.intent==='seek').length;stats[2].textContent=d.completed||allPosts.filter(x=>x.claimed).length}async function loadData(){try{mine=await AppAPI.getPosts({mine:1});allPosts=await AppAPI.getPosts();applyStats((await AppAPI.getMe()).stats||{})}catch{mine=readJson('campus_posts',[]);allPosts=mine.concat(readJson('campus_claimed_tasks',[]));applyStats({})}renderTasks('published')}function applyAvatar(src){if(!src){avatarButton.textContent='林';avatarButton.style.backgroundImage='';return}avatarButton.textContent='';avatarButton.style.backgroundImage='url("'+src.replace(/"/g,'')+'")'}async function loadProfile(){let p=readJson('campus_profile',{});try{p=await AppAPI.getMe();localStorage.setItem('campus_profile',JSON.stringify(p))}catch{}inputs.forEach(i=>{if(p[i.id]!=null)i.value=p[i.id]});document.getElementById('profileName').textContent=p.name||'林同学';applyAvatar(localStorage.getItem('campus_avatar')||'')}
function renderTasks(k){statButtons.forEach(t=>t.classList.toggle('active',t.dataset.kind===k));const s=k==='joined'?allPosts.filter(x=>x.claimed):mine.filter(x=>k==='seeking'?x.intent==='seek':true);if(!s.length){taskList.innerHTML='<div class="empty">这里还没有单<br>去首页看看，或点击中间按钮发布一条</div>';return}taskList.innerHTML=s.map(p=>'<a class="task-item" href="detail.html?id='+encodeURIComponent(p.id||'')+'"><div class="task-item-top"><b>'+esc(p.title||p.subcategory||p.category)+'</b><small>'+esc(p.category||'')+'</small></div><p>'+esc(p.place||'校内交接')+(p.time?' · '+esc(p.time):'')+'</p></a>').join('')}
function showTasks(k){showOnly(overview);renderTasks(k)}function showInfo(){showOnly(infoView);loadProfile()}function showOverview(){showOnly(overview);loadData()}function startEdit(){inputs.forEach(i=>{i.disabled=false;i.classList.add('editing')});editInfo.style.display='none';saveInfo.classList.add('show');inputs[0].focus()}async function finishEdit(){const p={};inputs.forEach(i=>{p[i.id]=i.value.trim();i.disabled=true;i.classList.remove('editing')});localStorage.setItem('campus_profile',JSON.stringify(p));try{localStorage.setItem('campus_profile',JSON.stringify(await AppAPI.updateProfile(p)))}catch{}document.getElementById('profileName').textContent=p.name||'林同学';editInfo.style.display='';saveInfo.classList.remove('show')}
statButtons.forEach(x=>x.onclick=()=>showTasks(x.dataset.kind));document.getElementById('profileName').onclick=()=>{showInfo();startEdit()};avatarButton.onclick=()=>avatarInput.click();avatarInput.onchange=()=>{const file=avatarInput.files&&avatarInput.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{localStorage.setItem('campus_avatar',reader.result);applyAvatar(reader.result)};reader.readAsDataURL(file)};document.getElementById('infoBack').onclick=showOverview;editInfo.onclick=startEdit;saveInfo.onclick=finishEdit;loadProfile();loadData();
</script></body></html>
