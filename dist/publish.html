<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>发布信息 - 校小易</title>
  <style>
    :root{--bg:#eceae7;--paper:#faf9f7;--ink:#282826;--muted:#8b8983;--line:#e8e4de;--accent:#5c63f2}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink)}.page{width:min(100%,538px);min-height:100vh;margin:auto;padding:20px;background:var(--paper)}.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.back{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:24px}.top h1{font-size:22px;margin:0}.form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.field{display:block;margin-bottom:16px}.field:last-child{margin-bottom:0}.field span{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit;outline:none;background:#fff;color:var(--ink)}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.submit{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:16px}.error{min-height:20px;color:#d85d4c;font-size:13px;margin:12px 2px 0}
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><button class="back" id="back" aria-label="返回">‹</button><h1>发布信息</h1></header>
    <form class="form" id="publishForm">
      <label class="field"><span>类型</span><select id="category" required></select></label>
      <label class="field"><span>具体项目</span><select id="subcategory" required></select></label>
      <label class="field"><span>一句话说明</span><input id="title" maxlength="40" placeholder="例如：周末电动车出租，电量足" required /></label>
      <label class="field"><span>详细说明</span><textarea id="detail" maxlength="300" placeholder="写清楚物品状况、交易方式等" required></textarea></label>
      <div class="row"><label class="field"><span>价格（元）</span><input id="price" type="number" min="0" step="0.01" placeholder="免费可填 0" required /></label><label class="field"><span>地点</span><input id="place" maxlength="30" placeholder="例如：东门" required /></label></div>
      <label class="field"><span>可取时间</span><input id="time" maxlength="40" placeholder="例如：今天 18:00 后" required /></label>
      <div class="error" id="error"></div><button class="submit" type="submit">发布信息</button>
    </form>
  </main>
  <script>
    const defs=[['租借',['电动车','大疆','iPhone','账号']],['拼车',['新乡东站','新乡站','考点','宝龙','大胖 / 二胖 / 三胖','其他']],['代取',['外卖','快递','饭来','印务','茶饮','小东小西']],['代买',['校外','超市','宝龙','胖东来']],['票券',['奶茶','餐食','健身房','演唱会']],['服务',['洗衣','妆造','摄像','陪练','找书']],['捎物',['假条','充电器','文件']],['信息差',['电话 / 微信','考试信息']]];
    const category=document.querySelector('#category'),subcategory=document.querySelector('#subcategory');
    category.innerHTML=defs.map(d=>`<option value="${d[0]}">${d[0]}</option>`).join('');
    function updateSub(){const d=defs.find(x=>x[0]===category.value);subcategory.innerHTML=d[1].map(x=>`<option value="${x}">${x}</option>`).join('')}
    category.onchange=updateSub;updateSub();document.querySelector('#back').onclick=()=>location.href='index.html';
    document.querySelector('#publishForm').onsubmit=e=>{e.preventDefault();const data={category:category.value,subcategory:subcategory.value,title:title.value.trim(),detail:detail.value.trim(),price:price.value,place:place.value.trim(),time:time.value.trim(),createdAt:Date.now()};if(!data.title||!data.detail||!data.place||!data.time){error.textContent='请把信息填写完整';return}const posts=JSON.parse(localStorage.getItem('campus_posts')||'[]');posts.unshift(data);localStorage.setItem('campus_posts',JSON.stringify(posts));location.href='index.html'};
  </script>
</body>
</html>
