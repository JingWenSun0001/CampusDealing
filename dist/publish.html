<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>发布信息 - 校小易</title>
<style>
:root{--bg:#eceae7;--paper:#faf9f7;--ink:#282826;--muted:#8b8983;--line:#e8e4de;--accent:#5c63f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink)}.page{width:min(100%,538px);min-height:100vh;margin:auto;padding:20px;background:var(--paper)}.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.back{width:44px;height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:25px}.top h1{font-size:22px;margin:0}.form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.select{display:block;width:100%;height:48px;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;padding:0 13px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}.select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}.dynamic{max-height:0;opacity:0;overflow:hidden;transform:translateY(-6px);transition:max-height .32s ease,opacity .25s ease,transform .32s ease}.dynamic.show{max-height:1400px;opacity:1;transform:translateY(0)}.panel{display:none}.panel.show{display:block}.panel-label{color:var(--muted);font-size:13px;margin:3px 0 8px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}.choices label{position:relative}.choices input{position:absolute;opacity:0}.choices span{display:block;text-align:center;border:1px solid var(--line);border-radius:11px;padding:12px 5px;font-size:14px;color:#666}.choices input:checked+span{border-color:var(--accent);background:#f0f1ff;color:var(--accent);font-weight:700}.field{display:block;margin-bottom:15px}.field span{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}.field textarea{min-height:82px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.price-grid .field span{font-size:12px}.hidden{display:none!important}.shared{border-top:1px solid var(--line);padding-top:15px;margin-top:3px}.submit{width:100%;margin-top:5px;padding:14px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:16px}.error{min-height:20px;color:#d85d4c;font-size:13px;margin:0 2px 8px}
</style>
<main class="page">
<header class="top"><button class="back" id="back" aria-label="返回">‹</button><h1>发布信息</h1></header>
<form class="form" id="publishForm">
<select class="select" id="category" aria-label="类型" required></select>
<select class="select" id="subcategory" aria-label="具体项目" required></select>
<div class="dynamic" id="dynamic">
<section class="panel" id="rentPanel">
<p class="panel-label">发布目的</p><div class="choices"><label><input type="radio" name="rentAction" value="offer" checked><span>我要出租</span></label><label><input type="radio" name="rentAction" value="seek"><span>我要借用</span></label></div>
<label class="field"><span>物品信息</span><input id="rentSummary" maxlength="60" placeholder="例如：九成新电动车，电量足" /></label>
<div class="price-grid"><label class="field"><span>每小时（元）</span><input id="rentHour" type="number" min="0" step="0.01" placeholder="可面议" /></label><label class="field"><span>每天（元）</span><input id="rentDay" type="number" min="0" step="0.01" placeholder="可面议" /></label><label class="field"><span>每周（元）</span><input id="rentWeek" type="number" min="0" step="0.01" placeholder="可面议" /></label></div>
<div class="row"><label class="field"><span>交接地点</span><input id="rentPlace" placeholder="例如：东门" /></label><label class="field"><span>可用时间</span><input id="rentTime" placeholder="例如：今天 18:00 后" /></label></div>
</section>
<section class="panel" id="carPanel">
<p class="panel-label">我想找搭子</p>
<div class="row"><label class="field"><span>还需几人</span><input id="carPeople" type="number" min="1" max="8" placeholder="人数" /></label><label class="field"><span>同行性别</span><select id="carGender"><option>不限</option><option>男生</option><option>女生</option></select></label></div>
<div class="row"><label class="field"><span>出发地</span><input id="carStart" placeholder="例如：南门" /></label><label class="field hidden" id="carOtherWrap"><span>目的地</span><input id="carOther" placeholder="填写你要去的地方" /></label></div>
<div class="row"><label class="field"><span>日期</span><input id="carDate" type="date" /></label><label class="field"><span>时间（05:00—00:00）</span><select id="carTime"></select></label></div>
</section>
<section class="panel" id="pickupPanel">
<p class="panel-label">代取目的</p><div class="choices"><label><input type="radio" name="pickupAction" value="seek" checked><span>求帮带</span></label><label><input type="radio" name="pickupAction" value="offer"><span>可帮带</span></label></div>
<label class="field"><span>本单价格（元）</span><input id="pickupPrice" type="number" min="0" step="0.01" placeholder="填写这一次的价格" /></label>
<div class="row"><label class="field"><span>取货地点</span><input id="pickupPlace" placeholder="例如：东门外卖柜" /></label><label class="field"><span>送达地点</span><input id="meetPlace" placeholder="例如：宿舍楼下" /></label></div>
<label class="field"><span id="orderLabel">取货信息</span><input id="orderValue" placeholder="填写取货所需信息" /></label>
<label class="field"><span>事项</span><input id="pickupSummary" maxlength="60" placeholder="例如：帮忙代取一份外卖" /></label>
</section>
<section class="panel" id="buyPanel">
<p class="panel-label">帮带目的</p><div class="choices"><label><input type="radio" name="buyAction" value="seek" checked><span>求帮带</span></label><label><input type="radio" name="buyAction" value="offer"><span>可帮带</span></label></div>
<label class="field"><span>事项</span><input id="buySummary" maxlength="60" placeholder="例如：带一杯少冰奶茶" /></label>
<div class="row"><label class="field"><span>具体摊位</span><input id="buyStall" placeholder="例如：二餐一楼" /></label><label class="field"><span>送达地点</span><input id="buyPlace" placeholder="例如：宿舍楼下" /></label></div>
<label class="field"><span>可选品牌</span><input id="buyBrand" placeholder="蜜雪冰城、益禾堂、幸运咖……" /></label>
<label class="field"><span>备注</span><textarea id="buyNote" placeholder="忌口、多菜少面等"></textarea></label>
<label class="field"><span>时间</span><input id="buyTime" placeholder="例如：今天 18:00 前" /></label>
</section>
<section class="panel" id="genericPanel">
<p class="panel-label">发布目的</p><div class="choices"><label><input type="radio" name="genericAction" value="seek" checked><span>我需要帮助</span></label><label><input type="radio" name="genericAction" value="offer"><span>我可以提供</span></label></div>
<label class="field"><span id="genericLabel">事项</span><input id="genericSummary" maxlength="60" placeholder="写清楚你想解决的事情" /></label>
<div class="row"><label class="field"><span>地点 / 交接</span><input id="genericPlace" placeholder="例如：东门" /></label><label class="field"><span>时间</span><input id="genericTime" placeholder="例如：今天 18:00 后" /></label></div>
</section>
<div class="shared">
<label class="field"><span>详情说明（可选）</span><textarea id="details" placeholder="例如：物品损坏如何赔偿、押金或其他约定"></textarea></label>
<label class="field"><span>微信 / QQ</span><input id="contact" maxlength="40" placeholder="方便联系时填写" /></label>
</div>
</div>
<div class="error" id="error"></div><button class="submit" type="submit">发布信息</button>
</form>
</main>
<script>
const defs=[['租借',['电动车','大疆','iPhone','账号']],['拼车',['新乡东站','新乡站','考点','宝龙','大胖 / 二胖 / 三胖','其他']],['代取',['外卖','快递','饭来','印务','茶饮','小东小西']],['代买',['校外','超市','宝龙','胖东来']],['票券',['奶茶','餐食','健身房','演唱会']],['服务',['洗衣','妆造','摄像','陪练','找书']],['捎物',['假条','充电器','文件']],['信息差',['电话 / 微信','考试信息']]];
const category=document.querySelector('#category'),subcategory=document.querySelector('#subcategory'),dynamic=document.querySelector('#dynamic'),error=document.querySelector('#error');
const panels={租借:document.querySelector('#rentPanel'),拼车:document.querySelector('#carPanel'),代取:document.querySelector('#pickupPanel'),代买:document.querySelector('#buyPanel'),generic:document.querySelector('#genericPanel')};
category.innerHTML=defs.map(d=>'<option value="'+d[0]+'">'+d[0]+'</option>').join('');
function fillTimes(){const values=[];for(let h=5;h<24;h++)values.push(String(h).padStart(2,'0')+':00');values.push('00:00');document.querySelector('#carTime').innerHTML=values.map(v=>'<option>'+v+'</option>').join('')}
function updateSub(){const d=defs.find(x=>x[0]===category.value);subcategory.innerHTML=d[1].map(x=>'<option value="'+x+'">'+x+'</option>').join('');subcategory.disabled=false;showPanel()}
function showPanel(){Object.values(panels).forEach(p=>p.classList.remove('show'));const panel=panels[category.value]||panels.generic;panel.classList.add('show');dynamic.classList.add('show');const details=document.querySelector('#details');details.placeholder=category.value==='租借'?'例如：损坏如何赔偿、押金、使用规则':category.value==='拼车'?'例如：集合方式、临时变更说明':category.value==='代买'?'例如：忌口、多菜少面、规格要求':category.value==='代取'?'例如：餐品不要洒、快递超时如何处理':'例如：尺寸、颜色、服务要求或其他约定';if(category.value==='拼车'){document.querySelector('#carOtherWrap').classList.toggle('hidden',subcategory.value!=='其他')}if(category.value==='代取'){const s=subcategory.value;document.querySelector('#orderLabel').textContent=s==='外卖'||s==='饭来'?'外卖单号':s==='快递'?'快递单号':'物品信息';document.querySelector('#orderValue').placeholder=s==='外卖'||s==='饭来'?'例如：订单尾号 1234':s==='快递'?'例如：取件码或快递柜号':'例如：物品名称'}document.querySelector('#genericLabel').textContent=category.value==='信息差'?'你需要知道什么？':'事项'}
category.onchange=updateSub;subcategory.onchange=showPanel;fillTimes();updateSub();document.querySelector('#back').onclick=()=>location.href='index.html';
document.querySelector('#publishForm').onsubmit=e=>{e.preventDefault();if(!category.value||!subcategory.value){error.textContent='请先选择类型和具体项目';return}let data={category:category.value,subcategory:subcategory.value,intent:'seek',title:'',detail:document.querySelector('#details').value.trim(),price:'',place:'',time:'',contact:document.querySelector('#contact').value.trim(),extra:{},createdAt:Date.now()};if(category.value==='租借'){const action=document.querySelector('input[name="rentAction"]:checked');data.intent=action?action.value:'offer';data.title=document.querySelector('#rentSummary').value.trim();data.place=document.querySelector('#rentPlace').value.trim();data.time=document.querySelector('#rentTime').value.trim();data.price=document.querySelector('#rentDay').value||document.querySelector('#rentHour').value||document.querySelector('#rentWeek').value;data.extra={action:data.intent,hour:document.querySelector('#rentHour').value,day:document.querySelector('#rentDay').value,week:document.querySelector('#rentWeek').value}}else if(category.value==='拼车'){const start=document.querySelector('#carStart').value.trim(),end=subcategory.value==='其他'?document.querySelector('#carOther').value.trim():subcategory.value,date=document.querySelector('#carDate').value,time=document.querySelector('#carTime').value;data.intent='seek';data.title=start+' → '+end;data.place=start+' → '+end;data.time=date+' '+time;data.extra={people:document.querySelector('#carPeople').value,gender:document.querySelector('#carGender').value}}else if(category.value==='代取'){const action=document.querySelector('input[name="pickupAction"]:checked');data.intent=action?action.value:'seek';data.title=document.querySelector('#pickupSummary').value.trim();data.price=document.querySelector('#pickupPrice').value;data.place=document.querySelector('#meetPlace').value.trim();data.extra={pickupPlace:document.querySelector('#pickupPlace').value.trim(),deliveryPlace:data.place,order:document.querySelector('#orderValue').value.trim()}}else if(category.value==='代买'){const action=document.querySelector('input[name="buyAction"]:checked');data.intent=action?action.value:'seek';data.title=document.querySelector('#buySummary').value.trim();data.place=document.querySelector('#buyPlace').value.trim();data.time=document.querySelector('#buyTime').value.trim();data.extra={stall:document.querySelector('#buyStall').value.trim(),brand:document.querySelector('#buyBrand').value.trim(),note:document.querySelector('#buyNote').value.trim()}}else{const action=document.querySelector('input[name="genericAction"]:checked');data.intent=action?action.value:'seek';data.title=document.querySelector('#genericSummary').value.trim();data.place=document.querySelector('#genericPlace').value.trim();data.time=document.querySelector('#genericTime').value.trim()}if(!data.title||data.title===' → '){error.textContent='请把事项填写完整';return}const posts=JSON.parse(localStorage.getItem('campus_posts')||'[]');posts.unshift(data);localStorage.setItem('campus_posts',JSON.stringify(posts));location.href='index.html'};
document.querySelector('#publishForm').addEventListener('submit',e=>{if(category.value==='拼车'&&subcategory.value==='其他'&&!document.querySelector('#carOther').value.trim()){e.preventDefault();e.stopImmediatePropagation();error.textContent='请填写其他目的地'}},true);
</script>
</body>
</html>
