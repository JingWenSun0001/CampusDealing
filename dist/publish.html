<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>发布信息 - 校小易</title>
<style>
:root{--bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--muted:#86868b;--line:#e5e5ea;--accent:#007aff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}.page{width:min(100%,538px);min-height:100vh;margin:auto;padding:20px 20px 102px;background:var(--paper)}.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.back{width:44px;height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:25px}.top h1{font-size:22px;margin:0}.form{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.select{display:block;width:100%;height:48px;margin-bottom:12px;border:1px solid var(--line);border-radius:12px;padding:0 13px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}.select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}.dynamic{max-height:0;opacity:0;overflow:hidden;transform:translateY(-6px);transition:max-height .32s ease,opacity .25s ease,transform .32s ease}.dynamic.show{max-height:1400px;opacity:1;transform:translateY(0)}.panel{display:none}.panel.show{display:block}.panel-label{color:var(--muted);font-size:13px;margin:3px 0 8px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}.choices label{position:relative}.choices input{position:absolute;opacity:0}.choices span{display:block;text-align:center;border:1px solid var(--line);border-radius:11px;padding:12px 5px;font-size:14px;color:#666}.choices input:checked+span{border-color:var(--accent);background:#f0f7ff;color:var(--accent);font-weight:700}.field{display:block;margin-bottom:15px}.field span{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink)}.field textarea{min-height:82px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.price-grid .field span{font-size:12px}.hidden{display:none!important}.shared{border-top:1px solid var(--line);padding-top:15px;margin-top:3px}.submit{width:100%;margin-top:5px;padding:14px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:16px}.error{min-height:20px;color:#d85d4c;font-size:13px;margin:0 2px 8px}.bottom{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,430px);height:76px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(229,229,234,.9);display:flex;justify-content:space-around;align-items:center;padding:7px 54px 8px}.nav-item,.nav-add{border:0;background:none;color:var(--muted);font-size:10px;text-decoration:none;text-align:center;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:42px}.nav-item.active{color:var(--accent);font-weight:700}.nav-item svg{width:21px;height:21px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav-add{width:48px;height:48px;min-width:48px;justify-content:center;border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(0,122,255,.28);margin-top:-19px;border:4px solid var(--paper)}.nav-add svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
</style>
<main class="page">
<header class="top"><button class="back" id="back" aria-label="返回">‹</button><h1>发布信息</h1></header>
<form class="form" id="publishForm">
<select class="select" id="category" aria-label="类型" required></select>
<select class="select" id="subcategory" aria-label="具体项目" required></select>
<div class="dynamic" id="dynamic">
<section class="panel" id="rentPanel">
<p class="panel-label">发布目的</p><div class="choices"><label><input type="radio" name="rentAction" value="offer" checked><span>我要出租</span></label><label><input type="radio" name="rentAction" value="seek"><span>我要借用</span></label></div>
<label class="field"><span>物品信息</span><input id="rentSummary" maxlength="60" placeholder="例如：九成新电动车，电量足" /></label>
<div class="price-grid"><label class="field"><span>每小时（元）</span><input id="rentHour" type="number" min="0" step="0.01" placeholder="可面议" /></label><label class="field"><span>每天（元）</span><input id="rentDay" type="number" min="0" step="0.01" placeholder="可面议" /></label><label class="field"><span>每周（元）</span><input id="rentWeek" type="number" min="0" step="0.01" placeholder="可面议" /></label></div>
<div class="row"><label class="field"><span>交接地点</span><input id="rentPlace" placeholder="例如：东门" /></label><label class="field"><span>可用时间</span><input id="rentTime" placeholder="例如：今天 18:00 后" /></label></div>
</section>
<section class="panel" id="carPanel">
<div class="row"><label class="field"><span>还需几人</span><select id="carPeople"><option value="1">1人</option><option value="2">2人</option><option value="3">3人</option></select></label><label class="field"><span>同行性别</span><select id="carGender"><option>不限</option><option>男生</option><option>女生</option></select></label></div>
<div class="row"><label class="field"><span>出发地</span><select id="carStart"></select></label><label class="field hidden" id="carOtherWrap"><span>目的地</span><input id="carOther" placeholder="填写你要去的地方" /></label></div>
<div class="row"><label class="field"><span>日期</span><input id="carDate" type="date" required /></label><label class="field"><span>时间</span><select id="carTime"></select></label></div>
</section>
<section class="panel" id="pickupPanel">
<p class="panel-label">代取目的</p><div class="choices"><label><input type="radio" name="pickupAction" value="seek" checked><span>求帮带</span></label><label><input type="radio" name="pickupAction" value="offer"><span>可帮带</span></label></div>
<label class="field"><span>本单价格（元）</span><input id="pickupPrice" type="number" min="0" step="0.01" placeholder="填写这一次的价格" /></label>
<div class="row"><label class="field"><span>取货地点</span><input id="pickupPlace" placeholder="例如：东门外卖柜" /></label><label class="field"><span>送达地点</span><input id="meetPlace" placeholder="例如：宿舍楼下" /></label></div>
<label class="field"><span id="orderLabel">取货信息</span><input id="orderValue" placeholder="填写取货所需信息" /></label>
<label class="field"><span>事项</span><input id="pickupSummary" maxlength="60" placeholder="例如：帮忙代取一份外卖" /></label>
</section>
<section class="panel" id="buyPanel">
<p class="panel-label">帮带目的</p><div class="choices"><label><input type="radio" name="buyAction" value="seek" checked><span>求帮带</span></label><label><input type="radio" name="buyAction" value="offer"><span>可帮带</span></label></div>
<label class="field"><span>事项</span><input id="buySummary" maxlength="60" placeholder="例如：带一杯少冰奶茶" /></label>
<div class="row"><label class="field"><span>具体摊位</span><input id="buyStall" placeholder="例如：二餐一楼" /></label><label class="field"><span>送达地点</span><input id="buyPlace" placeholder="例如：宿舍楼下" /></label></div>
<label class="field"><span>可选品牌</span><input id="buyBrand" placeholder="蜜雪冰城、益禾堂、幸运咖……" /></label>
<label class="field"><span>备注</span><textarea id="buyNote" placeholder="忌口、多菜少面等"></textarea></label>
<label class="field"><span>时间</span><input id="buyTime" placeholder="例如：今天 18:00 前" /></label>
<label class="field"><span>感谢费（元，可选）</span><input id="buyPrice" type="number" min="0" step="0.01" placeholder="不填则面议" /></label>
</section>
<section class="panel" id="genericPanel">
<p class="panel-label" id="genericPurposeLabel">发布目的</p><div class="choices" id="genericChoices"><label><input type="radio" name="genericAction" value="seek" checked><span>我需要帮助</span></label><label><input type="radio" name="genericAction" value="offer"><span>我可以提供</span></label></div>
<label class="field"><span id="genericLabel">事项</span><input id="genericSummary" maxlength="60" placeholder="写清楚你想解决的事情" /></label>
<div class="row"><label class="field"><span>地点 / 交接</span><input id="genericPlace" placeholder="例如：东门" /></label><label class="field"><span>时间</span><input id="genericTime" placeholder="例如：今天 18:00 后" /></label></div>
<label class="field"><span id="genericPriceLabel">金额（元，可选）</span><input id="genericPrice" type="number" min="0" step="0.01" placeholder="不填则面议" /></label>
</section>
<div class="shared">
<label class="field"><span>微信 / QQ / 电话</span><input id="contact" maxlength="60" placeholder="填写任一种联系方式" /></label>
</div>
</div>
<div class="error" id="error"></div><button class="submit" type="submit">发布信息</button>
</form>
<nav class="bottom" aria-label="主导航"><a class="nav-item" href="index.html" aria-label="首页"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.8 12 3.9l8.5 6.9v8.1a1.2 1.2 0 0 1-1.2 1.2H4.7a1.2 1.2 0 0 1-1.2-1.2z"/><path d="M9.3 20.1v-5.8h5.4v5.8"/></svg><span>首页</span></a><a class="nav-add" href="publish.html" aria-label="发布"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a><a class="nav-item" href="profile.html" aria-label="我的"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2"/><path d="M5.2 20c.9-3.3 3.1-5 6.8-5s5.9 1.7 6.8 5"/></svg><span>我的</span></a></nav>
</main>
<script src="api.js"></script>
<script>
const defs=[['租借',['电动车','大疆','iPhone','账号']],['拼车',['新乡东站','新乡站','宝龙','校本部','回学校','其他']],['代取',['外卖','快递','帮打印','茶饮','其他']],['代买',['小吃街','学子超市','宝龙','胖东来']],['票券',['奶茶','餐食','健身房','演唱会']],['服务',['洗衣','妆造','摄像','陪练','找书']],['捎物',['假条','充电器','文件']],['信息差',['电话 / 微信','考试信息']],['免费送',['书籍','生活用品','衣物','其他']]];
const category=document.querySelector('#category'),subcategory=document.querySelector('#subcategory'),dynamic=document.querySelector('#dynamic'),error=document.querySelector('#error');
const panels={租借:document.querySelector('#rentPanel'),拼车:document.querySelector('#carPanel'),代取:document.querySelector('#pickupPanel'),代买:document.querySelector('#buyPanel'),generic:document.querySelector('#genericPanel')};
category.innerHTML=defs.map(d=>'<option value="'+d[0]+'">'+d[0]+'</option>').join('');
function fillTimes(){const values=[];for(let h=5;h<24;h++)values.push(String(h).padStart(2,'0')+':00');values.push('00:00');document.querySelector('#carTime').innerHTML=values.map(v=>'<option>'+v+'</option>').join('')}
function formatDate(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function setCarDateRange(){const today=new Date();const max=new Date(today);max.setDate(today.getDate()+20);const input=document.querySelector('#carDate');input.min=formatDate(today);input.max=formatDate(max)}
function updateCarStarts(){
  const backToSchool=subcategory.value==='回学校';
  const options=backToSchool?['校本部','宝龙','东站','西站']:['西门','南门','东门','校本部','宝龙'];
  document.querySelector('#carStart').innerHTML=options.map(x=>'<option value="'+x+'">'+x+'</option>').join('');
}
function updateSub(){const d=defs.find(x=>x[0]===category.value);subcategory.innerHTML=d[1].map(x=>'<option value="'+x+'">'+x+'</option>').join('');subcategory.disabled=false;updateCarStarts();showPanel()}
function showPanel(){
  Object.values(panels).forEach(p=>p.classList.remove('show'));
  const panel=panels[category.value]||panels.generic;
  panel.classList.add('show');dynamic.classList.add('show');
  if(category.value==='拼车'){
    updateCarStarts();
    document.querySelector('#carOtherWrap').classList.toggle('hidden',subcategory.value!=='其他');
  }
  if(category.value==='代取'){
    const s=subcategory.value;
    document.querySelector('#orderLabel').textContent=s==='外卖'?'订单尾号':s==='快递'?'取件信息':s==='帮打印'?'打印要求':'物品信息';
    document.querySelector('#orderValue').placeholder=s==='外卖'?'例如：尾号 1234':s==='快递'?'例如：取件码或柜号':s==='帮打印'?'例如：黑白、双面、装订':'例如：物品名称';
  }
  const labels={票券:'票券说明',服务:'服务内容',捎物:'要捎的物品',信息差:'想问或分享的信息',免费送:'物品信息'};
  const priceLabels={票券:'票券价格（元，可选）',服务:'服务费（元，可选）',捎物:'感谢费（元，可选）',信息差:'感谢费（元，可选）',免费送:'金额（元，可选）'};
  document.querySelector('#genericLabel').textContent=labels[category.value]||'事项';
  document.querySelector('#genericPriceLabel').textContent=priceLabels[category.value]||'金额（元，可选）';
  const onlySeek=category.value==='捎物';
  document.querySelector('#genericPurposeLabel').classList.toggle('hidden',onlySeek);
  document.querySelector('#genericChoices').classList.toggle('hidden',onlySeek);
  if(onlySeek)document.querySelector('input[name="genericAction"][value="seek"]').checked=true;
}
category.onchange=updateSub;subcategory.onchange=showPanel;fillTimes();setCarDateRange();updateSub();document.querySelector('#back').onclick=()=>location.href='index.html';
document.querySelector('#publishForm').addEventListener('submit',e=>{if(category.value==='拼车'&&subcategory.value==='其他'&&!document.querySelector('#carOther').value.trim()){e.preventDefault();e.stopImmediatePropagation();error.textContent='请填写其他目的地'}},true);
function buildPublishData(){
  const data={category:category.value,subcategory:subcategory.value,intent:'seek',title:'',detail:'',price:'',place:'',time:'',contact:document.querySelector('#contact').value.trim(),extra:{}};
  if(category.value==='租借'){
    const action=document.querySelector('input[name="rentAction"]:checked'),hour=document.querySelector('#rentHour').value,day=document.querySelector('#rentDay').value,week=document.querySelector('#rentWeek').value;data.intent=action?action.value:'offer';data.title=document.querySelector('#rentSummary').value.trim();data.place=document.querySelector('#rentPlace').value.trim();data.time=document.querySelector('#rentTime').value.trim();data.price=day?day+'/天':hour?hour+'/小时':week?week+'/周':'';data.extra={action:data.intent,hour:hour,day:day,week:week};
  }else if(category.value==='拼车'){
    const start=document.querySelector('#carStart').value.trim(),end=subcategory.value==='其他'?document.querySelector('#carOther').value.trim():subcategory.value;data.intent='seek';data.title=start+' → '+end;data.place=start+' → '+end;data.time=(document.querySelector('#carDate').value+' '+document.querySelector('#carTime').value).trim();data.price='';data.extra={people:document.querySelector('#carPeople').value,gender:document.querySelector('#carGender').value};
  }else if(category.value==='代取'){
    const action=document.querySelector('input[name="pickupAction"]:checked');data.intent=action?action.value:'seek';data.title=document.querySelector('#pickupSummary').value.trim();data.price=document.querySelector('#pickupPrice').value;data.place=document.querySelector('#meetPlace').value.trim();data.extra={pickupPlace:document.querySelector('#pickupPlace').value.trim(),deliveryPlace:data.place,order:document.querySelector('#orderValue').value.trim()};
  }else if(category.value==='代买'){
    const action=document.querySelector('input[name="buyAction"]:checked');data.intent=action?action.value:'seek';data.title=document.querySelector('#buySummary').value.trim();data.place=document.querySelector('#buyPlace').value.trim();data.time=document.querySelector('#buyTime').value.trim();data.price=document.querySelector('#buyPrice').value;data.extra={stall:document.querySelector('#buyStall').value.trim(),brand:document.querySelector('#buyBrand').value.trim(),note:document.querySelector('#buyNote').value.trim()};
  }else{
    const action=document.querySelector('input[name="genericAction"]:checked');data.intent=category.value==='捎物'?'seek':action?action.value:'seek';data.title=document.querySelector('#genericSummary').value.trim();data.place=document.querySelector('#genericPlace').value.trim();data.time=document.querySelector('#genericTime').value.trim();data.price=document.querySelector('#genericPrice').value;
  }
  return data;
}
document.querySelector('#publishForm').addEventListener('submit',async e=>{
  e.preventDefault();e.stopImmediatePropagation();
  if(!category.value||!subcategory.value){error.textContent='请先选择类型和具体项目';return}
  const data=buildPublishData();
  if(category.value==='拼车'&&(!data.place.split(' → ')[0]||!data.place.split(' → ')[1])){error.textContent='请选择出发地和目的地';return}
  if(!data.title||data.title===' → '){error.textContent='请把事项填写完整';return}
  try{await AppAPI.createPost(data);location.href='index.html'}catch(err){error.textContent=err.message||'发布失败，请确认后端已启动'}
},true);
</script>
</body>
</html>
