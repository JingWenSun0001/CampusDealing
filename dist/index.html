<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校小易</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2ef;font-family:Arial,"Microsoft YaHei",sans-serif;color:#14211b}.app{max-width:430px;min-height:100vh;margin:auto;background:#f7f8f6;padding-bottom:72px}.top{padding:16px 14px 10px;background:#e6f2ea}.search{background:#fff;border-radius:14px;padding:11px 13px;color:#9aa49e;font-size:13px}.search input{border:0;outline:0;width:90%;font:inherit}.content{padding:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.cat{border:1px solid #e8ece9;background:#fff;border-radius:13px;padding:9px 2px 8px;text-align:center;font-size:12px}.pic{height:42px;border-radius:10px;background:#edf5ef;display:grid;place-items:center;margin-bottom:6px;color:#236b4d;font-size:21px;font-weight:800}.cat small{display:block;color:#7d8983;font-size:9px;margin-top:3px;white-space:nowrap;overflow:hidden}.subpage{display:none}.subpage.show{display:block}.subhead{display:flex;align-items:center;gap:10px;margin-bottom:18px}.back{border:0;background:#fff;border-radius:10px;width:34px;height:34px;font-size:20px}.subhead h2{font-size:19px;margin:0}.subhead small{color:#7d8983}.subitems{display:flex;flex-wrap:wrap;gap:10px}.subitem{background:#fff;border:1px solid #e8ece9;border-radius:12px;padding:13px 15px;font-size:14px;color:#236b4d}.subhint{margin-top:20px;color:#9aa49e;font-size:12px}.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.card{background:#fff;border:1px solid #e8ece9;border-radius:14px;overflow:hidden}.photo{height:135px;background-size:cover;background-position:center}.copy{padding:10px 11px 12px}.copy h3{font-size:13px;margin:4px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy p{font-size:10px;color:#7d8983;margin:0}.price{color:#ff7b48;font-size:14px;font-weight:900;margin-top:8px}.bottom{position:fixed;bottom:0;width:min(100%,430px);height:68px;background:#fff;border-top:1px solid #e8ece9;display:flex;justify-content:space-around;align-items:center}.bottom a,.plus{border:0;background:none;color:#7d8983;font-size:11px;text-decoration:none;text-align:center}.bottom a:first-child{color:#236b4d;font-weight:800}.plus{background:#ff7b48!important;color:#fff!important;width:50px;height:50px;border-radius:17px;font-size:26px!important;margin-top:-22px;border:5px solid #f7f8f6!important}</style><main class="app"><header class="top"><div class="search">⌕　<input id="q" placeholder="搜索校内商品、服务"></div></header><section class="content"><div id="homeView"><div class="grid" id="cats"></div><div class="feed" id="feed"></div></div><div class="subpage" id="subView"><div class="subhead"><button class="back" id="back">‹</button><div><h2 id="subTitle"></h2><small>选择你要找的具体内容</small></div></div><div class="subitems" id="subItems"></div><div class="subhint">没有看到想要的？点击下方＋发布，让系统帮你自动归类。</div></div></section><nav class="bottom"><a href="index.html">⌂<br>首页</a><button class="plus">＋</button><a href="profile.html">◉<br>我的</a></nav></main><script>const defs=[['租借','电动车|大疆|iphone|账号（小心诈骗）','⌁'],['拼车','（有建小群的需求）|新乡东站|新乡站|考点|宝龙|大胖/二胖/三胖|其他','⌂'],['代取','外卖|快递|饭来|印务|茶饮|小东小西','▣'],['代买','校外|超市|宝龙|胖东来','▤'],['票券','奶茶|餐食|健身房|演唱会','▱'],['服务','洗衣|妆造|摄像|陪练|找书','✦'],['捎物','假条|充电器|文件','↗'],['信息差','电话/微信|考试信息','?']],cats=document.querySelector('#cats'),home=document.querySelector('#homeView'),sub=document.querySelector('#subView'),title=document.querySelector('#subTitle'),items=document.querySelector('#subItems');cats.innerHTML=defs.map((d,i)=>`<button class="cat" data-i="${i}"><div class="pic">${d[2]}</div><b>${d[0]}</b><small>${d[1].split('|').slice(0,3).join(' · ')}</small></button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{const d=defs[b.dataset.i];title.textContent=d[0];items.innerHTML=d[1].split('|').map(x=>`<button class="subitem">${x}</button>`).join('');home.style.display='none';sub.classList.add('show')});document.querySelector('#back').onclick=()=>{sub.classList.remove('show');home.style.display='block'};document.querySelector('#feed').innerHTML='<article class="card"><div class="photo" style="background-image:url(https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=600&q=80)"></div><div class="copy"><h3>周末电动车出租，电量足</h3><p>⌖ 西门取车 · 阿泽</p><div class="price">10 元/天</div></div></article>';</script>
