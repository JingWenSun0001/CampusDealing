<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校小易</title>
<style>
:root{--ink:#292927;--muted:#98958f;--line:#e9e6e0;--paper:#faf9f7;--accent:#5c63f2;--hot:#ef7445}
*{box-sizing:border-box}body{margin:0;background:#eceae7;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink)}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--paper);padding-bottom:76px}.top{padding:16px;background:#f3f1ed}.search{height:42px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;color:#aaa7a1;font-size:13px}.search input{border:0;outline:0;width:90%;font:inherit;background:transparent}.content{padding:14px}.quick{display:grid;grid-template-columns:1fr 1.45fr;gap:10px;margin-bottom:14px}.clock,.refresh{border:1px solid var(--line);background:#fff;border-radius:16px}.clock{padding:13px 14px}.clock small{display:block;color:var(--muted);font-size:11px}.clock b{display:block;margin-top:5px;font-size:22px;letter-spacing:1px}.refresh{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;text-align:left}.refresh b{font-size:14px}.refresh span{font-size:22px;color:var(--accent)}.urgent{display:flex;gap:8px;overflow-x:auto;margin-top:9px;padding-bottom:2px}.urgent::-webkit-scrollbar{display:none}.urgent-item{flex:0 0 146px;min-height:58px;padding:10px 11px;border:1px solid #f2d8cc;border-radius:13px;background:#fff8f4;text-align:left}.urgent-item strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.urgent-item small{display:block;color:var(--hot);font-size:10px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px}.cat{grid-column:span 2;min-height:68px;border:1px solid var(--line);background:#fff;border-radius:15px;padding:10px 5px;text-align:center;font-size:13px;color:var(--ink)}.cat.hot{grid-column:span 3;min-height:76px}.cat.small{grid-column:span 1;font-size:11px}.pic{height:29px;display:grid;place-items:center;margin-bottom:5px;color:#686760}.pic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.cat small{display:none}.subpage{display:none}.subpage.show{display:block}.subhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}.back{border:1px solid var(--line);background:#fff;border-radius:11px;width:36px;height:36px;font-size:20px;color:var(--ink)}.subhead h2{font-size:19px;margin:0}.subitems{display:flex;gap:9px;overflow-x:auto;padding:2px 1px 7px}.subitems::-webkit-scrollbar{display:none}.subitem{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;color:var(--ink);font-size:13px;white-space:nowrap}.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.photo{height:135px;background-size:cover;background-position:center}.copy{padding:10px 11px 12px}.copy h3{font-size:13px;margin:4px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy p{font-size:10px;color:var(--muted);margin:0}.price{color:var(--hot);font-size:14px;font-weight:900;margin-top:8px}.bottom{position:fixed;bottom:0;width:min(100%,430px);height:70px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}.bottom a,.plus{border:0;background:none;color:#9b9993;font-size:11px;text-decoration:none;text-align:center}.bottom a:first-child{color:var(--accent);font-weight:800}.plus{background:var(--accent)!important;color:#fff!important;width:51px;height:51px;border-radius:17px;font-size:26px!important;margin-top:-22px;border:5px solid var(--paper)!important}
</style>
<style>.boards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.board{min-width:0}.board-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;font-size:13px}.board-head button{border:0;background:#fff;border-radius:9px;color:var(--accent);font-size:17px}.board-list{display:grid;gap:8px}.board-card{padding:11px;border:1px solid var(--line);border-radius:13px;background:#fff;min-height:76px}.board-card strong{display:block;font-size:12px;line-height:1.45}.board-card small{display:block;color:var(--muted);font-size:10px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style>
<main class="app">
<header class="top"><div class="search">⌕　<input id="search" placeholder="搜索"></div></header>
<section class="content">
<div id="homeView">
<div class="quick"><div class="clock"><small>现在</small><b id="clock">--:--</b></div><button class="refresh" id="refresh"><b>急需解决</b><span>↻</span></button></div>
<div class="urgent" id="urgent"></div>
<div class="grid" id="cats"></div>
<div class="boards"><section class="board urgent-board"><div class="board-head"><b>紧急处理</b><button id="refreshBoard" aria-label="刷新">↻</button></div><div class="board-list" id="urgentBoard"></div></section><section class="board market-board"><div class="board-head"><b>出物 / 租借</b></div><div class="board-list" id="marketBoard"></div></section></div>
</div>
<div class="subpage" id="subView"><div class="subhead"><button class="back" id="back">‹</button><h2 id="subTitle"></h2></div><div class="subitems" id="subItems"></div></div>
</section>
<nav class="bottom"><a href="index.html">⌂<br>首页</a><a class="plus" href="publish.html">＋</a><a href="profile.html">◉<br>我的</a></nav>
</main>
<script>
const I={rent:'<svg viewBox="0 0 32 32"><path d="M7 22c3-5 7-8 11-8 3 0 5 2 7 5M7 22c-1 2 1 4 3 3l4-3M18 11h7v5h-7z"/></svg>',car:'<svg viewBox="0 0 32 32"><path d="M7 20l2-7h14l3 7v5H7zM10 13l2-4h8l2 4M10 23h1M22 23h1"/></svg>',bag:'<svg viewBox="0 0 32 32"><path d="M8 12h16l2 14H6zM12 12a4 4 0 0 1 8 0M11 18h10"/></svg>',shop:'<svg viewBox="0 0 32 32"><path d="M7 12h18l-2 14H9zM9 12l2-5h10l2 5M12 17h8"/></svg>',ticket:'<svg viewBox="0 0 32 32"><path d="M6 11h20v10H6zM11 11v10M21 11v10M15 13v6"/></svg>',heart:'<svg viewBox="0 0 32 32"><path d="M16 25S6 19 6 12a5 5 0 0 1 10-2 5 5 0 0 1 10 2c0 7-10 13-10 13z"/></svg>',pen:'<svg viewBox="0 0 32 32"><path d="M8 24h16M10 20l10-10 3 3-10 10-4 1z"/></svg>',info:'<svg viewBox="0 0 32 32"><path d="M9 7h11l4 4v14H9zM20 7v5h4M13 17h7M13 21h5"/></svg>'};
const defs=[['租借',['电动车','大疆','iPhone','账号'],'rent'],['拼车',['新乡东站','新乡站','考点','宝龙','大胖 / 二胖 / 三胖','其他'],'car'],['代取',['外卖','快递','饭来','印务','茶饮','小东小西'],'bag'],['代买',['校外','超市','宝龙','胖东来'],'shop'],['票券',['奶茶','餐食','健身房','演唱会'],'ticket'],['服务',['洗衣','妆造','摄像','陪练','找书'],'heart'],['捎物',['假条','充电器','文件'],'pen'],['信息差',['电话 / 微信','考试信息'],'info']];
const cats=document.querySelector('#cats'),home=document.querySelector('#homeView'),sub=document.querySelector('#subView'),urgentBoard=document.querySelector('#urgentBoard'),marketBoard=document.querySelector('#marketBoard'),search=document.querySelector('#search');
const weights={代取:'hot',拼车:'hot',服务:'normal',租借:'normal',代买:'normal',票券:'normal',捎物:'small',信息差:'small'};
cats.innerHTML=defs.map((d,i)=>'<button class="cat '+weights[d[0]]+'" data-i="'+i+'"><div class="pic">'+I[d[3]]+'</div><b>'+d[0]+'</b></button>').join('');
const urgentDefaults=[['代取','帮带奶茶 / 外卖'],['拼车','新乡东站 → 学校'],['代取','帮忙打印 / 取件'],['票券','奶茶 / 餐食']];
function readPosts(){try{return JSON.parse(localStorage.getItem('campus_posts')||'[]')}catch{return[]}}
function renderUrgent(){const saved=readPosts().filter(p=>p.intent==='seek').map(p=>[p.subcategory||p.category,p.title]);const items=[...saved,...urgentDefaults].slice(0,8);document.querySelector('#urgent').innerHTML=items.map(x=>'<div class="urgent-item"><strong>'+x[1]+'</strong><small>'+x[0]+' · 急需</small></div>').join('')}
function renderBoards(filter={}){const sample={category:'租借',subcategory:'电动车',intent:'offer',title:'周末电动车出租，电量足',price:'10',place:'西门取车 · 阿泽'};const all=readPosts();const urgent=all.filter(p=>p.intent==='seek').filter(p=>!filter.category||p.category===filter.category);const market=[sample,...all.filter(p=>p.intent!=='seek')].filter(p=>!filter.category||p.category===filter.category);urgentBoard.innerHTML=(urgent.length?urgent:[{category:'代取',subcategory:'外卖',title:'帮忙代取东门外卖',place:'校内'}]).slice(0,6).map(p=>'<article class="board-card"><strong>'+p.title+'</strong><small>'+p.category+' · '+(p.subcategory||'')+(p.place?' · '+p.place:'')+'</small></article>').join('');marketBoard.innerHTML=market.slice(0,6).map(p=>'<article class="board-card"><strong>'+p.title+'</strong><small>'+p.category+' · '+(p.subcategory||'')+(p.price?' · '+p.price+' 元':' · 面议')+'</small></article>').join('')}
const baseRenderBoards=renderBoards;renderBoards=function(filter={}){baseRenderBoards(filter);const q=search.value.trim().toLowerCase();if(q)[urgentBoard,marketBoard].forEach(board=>[...board.children].forEach(card=>card.hidden=!card.textContent.toLowerCase().includes(q)))}
function updateClock(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function openCategory(i){const d=defs[i];document.querySelector('#subTitle').textContent=d[0];document.querySelector('#subItems').innerHTML=d[1].map(x=>'<button class="subitem">'+x+'</button>').join('');document.querySelectorAll('.subitem').forEach((item,j)=>item.onclick=()=>{home.style.display='block';sub.classList.remove('show');renderBoards({category:d[0],subcategory:d[1][j]})});home.style.display='none';sub.classList.add('show')}
document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>openCategory(Number(b.dataset.i)));document.querySelector('#back').onclick=()=>{sub.classList.remove('show');home.style.display='block';renderBoards()};search.addEventListener('input',()=>renderBoards());document.querySelector('#refresh').onclick=()=>{updateClock();renderUrgent();renderBoards()};document.querySelector('#refreshBoard').onclick=renderBoards;window.addEventListener('storage',()=>{renderUrgent();renderBoards()});updateClock();setInterval(updateClock,1000);renderUrgent();renderBoards();
</script>
</body>
</html>
