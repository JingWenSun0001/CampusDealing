<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校小易</title><style>:root{--ink:#282826;--muted:#8b8983;--line:#eeeae4;--paper:#faf9f7;--accent:#5c63f2}*{box-sizing:border-box}body{margin:0;background:#eceae7;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink)}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--paper);padding-bottom:76px}.top{padding:17px 16px 14px;background:#f3f1ed}.search{height:42px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;color:#aaa7a1;font-size:13px}.search input{border:0;outline:0;width:90%;font:inherit;background:transparent}.content{padding:16px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.cat{min-width:0;border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px 4px 10px;text-align:center;font-size:12px}.pic{height:38px;display:grid;place-items:center;margin-bottom:8px;color:#686760}.pic svg{width:29px;height:29px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.cat small{display:block;color:var(--muted);font-size:9px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subpage{display:none}.subpage.show{display:block}.subhead{display:flex;align-items:center;gap:10px;margin-bottom:18px}.back{border:1px solid var(--line);background:#fff;border-radius:11px;width:36px;height:36px;font-size:20px;color:var(--ink)}.subhead h2{font-size:19px;margin:0}.subitems{display:flex;gap:9px;overflow-x:auto;padding:2px 1px 7px}.subitems::-webkit-scrollbar{display:none}.subitem{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;color:var(--ink);font-size:13px;white-space:nowrap}.section-title{font-size:16px;font-weight:800;margin:22px 0 11px}.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.photo{height:135px;background-size:cover;background-position:center}.copy{padding:10px 11px 12px}.copy h3{font-size:13px;margin:4px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy p{font-size:10px;color:var(--muted);margin:0}.price{color:#ef7445;font-size:14px;font-weight:900;margin-top:8px}.bottom{position:fixed;bottom:0;width:min(100%,430px);height:70px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}.bottom a,.plus{border:0;background:none;color:#9b9993;font-size:11px;text-decoration:none;text-align:center}.bottom a:first-child{color:var(--accent);font-weight:800}.plus{background:var(--accent)!important;color:#fff!important;width:51px;height:51px;border-radius:17px;font-size:26px!important;margin-top:-22px;border:5px solid var(--paper)!important}</style><main class="app"><header class="top"><div class="search">⌕　<input placeholder="搜索校内商品、服务"></div></header><section class="content"><div id="homeView"><div class="grid" id="cats"></div><div class="feed" id="feed"></div></div><div class="subpage" id="subView"><div class="subhead"><button class="back" id="back">‹</button><h2 id="subTitle"></h2></div><div class="subitems" id="subItems"></div></div></section><nav class="bottom"><a href="index.html">⌂<br>首页</a><a class="plus" href="publish.html">＋</a><a href="profile.html">◉<br>我的</a></nav></main><script>const I={rent:'<svg viewBox="0 0 32 32"><path d="M7 22c3-5 7-8 11-8 3 0 5 2 7 5M7 22c-1 2 1 4 3 3l4-3M18 11h7v5h-7z"/></svg>',car:'<svg viewBox="0 0 32 32"><path d="M7 20l2-7h14l3 7v5H7zM10 13l2-4h8l2 4M10 23h1M22 23h1"/></svg>',bag:'<svg viewBox="0 0 32 32"><path d="M8 12h16l2 14H6zM12 12a4 4 0 0 1 8 0M11 18h10"/></svg>',shop:'<svg viewBox="0 0 32 32"><path d="M7 12h18l-2 14H9zM9 12l2-5h10l2 5M12 17h8"/></svg>',ticket:'<svg viewBox="0 0 32 32"><path d="M6 11h20v10H6zM11 11v10M21 11v10M15 13v6"/></svg>',heart:'<svg viewBox="0 0 32 32"><path d="M16 25S6 19 6 12a5 5 0 0 1 10-2 5 5 0 0 1 10 2c0 7-10 13-10 13z"/></svg>',pen:'<svg viewBox="0 0 32 32"><path d="M8 24h16M10 20l10-10 3 3-10 10-4 1z"/></svg>',info:'<svg viewBox="0 0 32 32"><path d="M9 7h11l4 4v14H9zM20 7v5h4M13 17h7M13 21h5"/></svg>'};const defs=[['租借',['电动车','大疆','iPhone','账号'],'rent','电动车 · 大疆'],['拼车',['新乡东站','新乡站','考点','宝龙','大胖 / 二胖 / 三胖','其他'],'car','新乡东站 · 宝龙'],['代取',['外卖','快递','饭来','印务','茶饮','小东小西'],'bag','外卖 · 快递'],['代买',['校外','超市','宝龙','胖东来'],'shop','校外 · 超市'],['票券',['奶茶','餐食','健身房','演唱会'],'ticket','奶茶 · 餐食'],['服务',['洗衣','妆造','摄像','陪练','找书'],'heart','洗衣 · 妆造'],['捎物',['假条','充电器','文件'],'pen','假条 · 充电器'],['信息差',['电话 / 微信','考试信息'],'info','电话 / 微信']];const cats=document.querySelector('#cats'),home=document.querySelector('#homeView'),sub=document.querySelector('#subView');cats.innerHTML=defs.map((d,i)=>`<button class="cat" data-i="${i}"><div class="pic">${I[d[2]]}</div><b>${d[0]}</b><small>${d[3]}</small></button>`).join('');function renderFeed(filter={}){const saved=JSON.parse(localStorage.getItem('campus_posts')||'[]');const sample={category:'租借',subcategory:'电动车',title:'周末电动车出租，电量足',detail:'',price:'10',place:'西门取车 · 阿泽',time:'',image:'https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=600&q=80'};const items=[sample,...saved].filter(p=>{const text=[p.category,p.subcategory,p.title,p.detail,p.place].join(' ').toLowerCase();return(!filter.category||p.category===filter.category)&&(!filter.subcategory||p.subcategory===filter.subcategory)&&(!search.value||text.includes(search.value.trim().toLowerCase()))});feed.innerHTML=items.length?items.map(p=>'<article class="card"><div class="photo" style="background-image:url('+((p.image)||'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80')+')"></div><div class="copy"><h3>'+p.title+'</h3><p>⌖ '+p.place+(p.time?' · '+p.time:'')+'</p><div class="price">'+(p.price==='0'?'免费':p.price+' 元')+'</div></div></article>').join(''):'<p style="color:#8b8983;font-size:13px">暂时没有相关信息</p>'}function openCategory(i){const d=defs[i];document.querySelector('#subTitle').textContent=d[0];document.querySelector('#subItems').innerHTML=d[1].map(x=>'<button class="subitem">'+x+'</button>').join('');document.querySelectorAll('.subitem').forEach((item,j)=>item.onclick=()=>{home.style.display='block';sub.classList.remove('show');renderFeed({category:d[0],subcategory:d[1][j]})});home.style.display='none';sub.classList.add('show')}document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>openCategory(Number(b.dataset.i)));const feed=document.querySelector('#feed'),search=document.querySelector('.search input');document.querySelector('#back').onclick=()=>{sub.classList.remove('show');home.style.display='block';renderFeed()};search.addEventListener('input',()=>renderFeed());renderFeed()</script>
