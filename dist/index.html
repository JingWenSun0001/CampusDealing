<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校小易</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2ef;font-family:Arial,"Microsoft YaHei",sans-serif;color:#14211b}.app{max-width:430px;min-height:100vh;margin:auto;background:#f7f8f6;padding-bottom:72px}.top{padding:16px 14px 10px;background:#e6f2ea}.search{background:#fff;border-radius:14px;padding:11px 13px;color:#9aa49e;font-size:13px}.search input{border:0;outline:0;width:90%;font:inherit}.content{padding:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.cat{border:1px solid #e8ece9;background:#fff;border-radius:13px;padding:9px 2px 8px;text-align:center;font-size:12px}.cat.active{border-color:#236b4d;background:#edf7f0}.pic{height:42px;border-radius:10px;background:#edf5ef;display:grid;place-items:center;margin-bottom:6px;color:#236b4d;font-size:21px;font-weight:800}.cat small{display:block;color:#7d8983;font-size:9px;margin-top:3px;white-space:nowrap;overflow:hidden}.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.card{background:#fff;border:1px solid #e8ece9;border-radius:14px;overflow:hidden}.photo{height:135px;background-size:cover;background-position:center}.copy{padding:10px 11px 12px}.copy h3{font-size:13px;margin:4px 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy p{font-size:10px;color:#7d8983;margin:0}.price{color:#ff7b48;font-size:14px;font-weight:900;margin-top:8px}.empty{grid-column:1/-1;text-align:center;color:#9aa49e;padding:45px 10px}.bottom{position:fixed;bottom:0;width:min(100%,430px);height:68px;background:#fff;border-top:1px solid #e8ece9;display:flex;justify-content:space-around;align-items:center}.bottom a,.plus{border:0;background:none;color:#7d8983;font-size:11px;text-decoration:none;text-align:center}.bottom a:first-child{color:#236b4d;font-weight:800}.plus{background:#ff7b48!important;color:#fff!important;width:50px;height:50px;border-radius:17px;font-size:26px!important;margin-top:-22px;border:5px solid #f7f8f6!important}.modal{display:none}.modal.show{display:block;position:fixed;inset:auto 0 0;background:#fff;padding:22px 20px;border-radius:22px 22px 0 0;max-width:430px;margin:auto;z-index:4}.modal input{width:100%;padding:11px;margin:5px 0;border:1px solid #e8ece9;border-radius:11px}.publish{width:100%;padding:12px;border:0;border-radius:12px;background:#236b4d;color:#fff}</style><main class="app"><header class="top"><div class="search">⌕　<input id="q" placeholder="搜索校内商品、服务"></div></header><section class="content"><div class="grid" id="cats"></div><div class="feed" id="feed"></div></section><nav class="bottom"><a href="index.html">⌂<br>首页</a><button class="plus" id="openBtn">＋</button><a href="profile.html">◉<br>我的</a></nav><div class="modal" id="modal"><button id="closeBtn" style="float:right;border:0;background:none;font-size:20px">×</button><input id="title" placeholder="描述一下你要发布的内容，系统会自动分类"><input id="cost" placeholder="价格（填 0 即为免费）"><input id="place" placeholder="取货地点"><input id="time" placeholder="可取时间"><button class="publish" id="doneBtn">发布</button></div></main><script>const icons=['⌁','⌂','▣','▤','▱','✦','↗','?'],cats=[['租借','电动车 · 大疆 · iPhone'],['拼车','新乡东站 · 宝龙'],['代取','外卖 · 快递 · 印务'],['代买','校外 · 超市 · 胖东来'],['票券','奶茶 · 餐食 · 健身房'],['服务','洗衣 · 妆造 · 摄像'],['捎物','假条 · 充电器 · 文件'],['信息差','电话 · 微信 · 考试']],catEl=document.querySelector('#cats'),feedEl=document.querySelector('#feed'),q=document.querySelector('#q');catEl.innerHTML=cats.map((c,i)=>`<button class="cat" data-cat="${c[0]}"><div class="pic">${icons[i]}</div><b>${c[0]}</b><small>${c[1]}</small></button>`).join('');let items=[['用品','临期水果拼单，多了两盒','3号楼楼下 · 果果','12 元/盒','https://images.unsplash.com/photo-1610832958506-aa56368176cf?auto=format&fit=crop&w=600&q=80'],['用品','半袋洗衣液，毕业带不走','3号楼楼下 · 周同学','免费','https://images.unsplash.com/photo-1608632308099-0f7c2b9f5a9f?auto=format&fit=crop&w=600&q=80'],['租借','周末电动车出租，电量足','西门取车 · 阿泽','10 元/天','https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=600&q=80'],['票券','健身房次卡 3 张','今天可用 · 小陈','15 元/张','https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=600&q=80']];let active='全部';function render(){const term=q.value.trim();const list=items.filter(x=>(active==='全部'||x[0]===active)&&(!term||x.join('').includes(term)));feedEl.innerHTML=list.length?list.map(d=>`<article class="card"><div class="photo" style="background-image:url('${d[4]}')"></div><div class="copy"><h3>${d[1]}</h3><p>⌖ ${d[2]}</p><div class="price">${d[3]}</div></div></article>`).join(''):'<div class="empty">没有找到相关信息<br><small>试试换个关键词，或发布一条</small></div>'}render();document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.cat;render()});q.oninput=render;const modal=document.querySelector('#modal');openBtn.onclick=()=>modal.classList.add('show');closeBtn.onclick=()=>modal.classList.remove('show');doneBtn.onclick=()=>{if(!title.value.trim())return;items.unshift(['用品',title.value,place.value||'待约地点',cost.value||'面议','https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80']);modal.classList.remove('show');title.value='';cost.value='';place.value='';time.value='';active='全部';document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));render()};</script>
