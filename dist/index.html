<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校小易</title>
<style>
:root{--ink:#292927;--muted:#98958f;--line:#e7e3dd;--paper:#faf9f7;--accent:#5c63f2;--hot:#ef7445}
*{box-sizing:border-box}body{margin:0;background:#eceae7;font-family:Arial,"Microsoft YaHei",sans-serif;color:var(--ink)}.app{max-width:430px;min-height:100vh;margin:auto;background:var(--paper);padding-bottom:76px}.top{padding:15px 16px 12px;background:#f3f1ed;display:flex;align-items:center;gap:9px}.search{height:40px;flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:#aaa7a1;font-size:13px}.search input{border:0;outline:0;width:88%;font:inherit;background:transparent}.clock{font-size:11px;color:var(--muted);white-space:nowrap}.content{padding:13px}.urgent-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}.urgent-card{min-height:53px;border:1px solid #f1d5c9;border-radius:11px;background:#fff8f4;padding:9px 8px;text-align:left}.urgent-card strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.urgent-card small{display:block;margin-top:5px;color:var(--hot);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.category-board{display:grid;grid-template-columns:1.42fr 1fr .48fr;grid-template-rows:44px 44px 44px 44px;gap:6px;margin-bottom:13px}.cat{border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--ink);padding:7px 5px;font-size:12px}.cat b{display:block}.cat .pic{display:none}.cat.pickup{grid-column:1;grid-row:1/3;font-size:15px}.cat.carpool{grid-column:2;grid-row:1}.cat.buy{grid-column:2;grid-row:2}.cat.ticket{grid-column:2;grid-row:3}.cat.rent{grid-column:2;grid-row:4}.cat.service{grid-column:1;grid-row:3/5;font-size:15px}.cat.info{grid-column:3;grid-row:1/2;font-size:10px}.cat.item{grid-column:3;grid-row:2/4;font-size:10px}.cat:active{border-color:var(--accent)}.refresh-row{margin-bottom:10px}.refresh-row button{border:1px solid var(--ink);background:#fff;border-radius:7px;padding:5px 12px;font-size:11px}.boards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.board{min-width:0}.board-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:13px}.board-head button{border:0;background:none;color:var(--accent);font-size:16px}.board-list{display:grid;gap:7px}.need-card{padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;min-height:56px}.need-card strong{display:block;font-size:11px;line-height:1.4}.need-card small{display:block;color:var(--muted);font-size:9px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-card{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}.media-card .photo{height:91px;background-size:cover;background-position:center}.media-card .copy{padding:8px}.media-card h3{font-size:11px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-card p{font-size:9px;color:var(--muted);margin:5px 0 0}.price{font-size:12px;color:var(--hot);font-weight:800;margin-top:6px}.subpage{display:none}.subpage.show{display:block}.subhead{display:flex;align-items:center;gap:9px;margin-bottom:13px}.back{border:1px solid var(--line);background:#fff;border-radius:10px;width:35px;height:35px;font-size:20px}.subhead h2{font-size:18px;margin:0}.subitems{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.subitems::-webkit-scrollbar{display:none}.subitem{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:12px}.bottom{position:fixed;bottom:0;width:min(100%,430px);height:70px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}.bottom a,.plus{border:0;background:none;color:#9b9993;font-size:11px;text-decoration:none;text-align:center}.bottom a:first-child{color:var(--accent);font-weight:800}.plus{background:var(--accent)!important;color:#fff!important;width:51px;height:51px;border-radius:17px;font-size:26px!important;margin-top:-22px;border:5px solid var(--paper)!important}
</style>
<style>.cat.item{grid-row:2/5}</style>
<main class="app">
<header class="top"><div class="search">⌕　<input id="search" placeholder="搜索"></div></header>
<section class="content">
<div id="homeView">
<div class="urgent-strip" id="urgentTop"></div>
<div class="category-board" id="cats"></div>
<div class="boards">
<section class="board"><div class="board-head"><b>加急处理</b><button id="refreshNeeds">↻</button></div><div class="board-list" id="urgentBoard"></div></section>
<section class="board"><div class="board-head"><b>出物 / 租借</b></div><div class="board-list" id="marketBoard"></div></section>
</div>
</div>
<div class="subpage" id="subView"><div class="subhead"><button class="back" id="back">‹</button><h2 id="subTitle"></h2></div><div class="subitems" id="subItems"></div></div>
</section>
<nav class="bottom"><a href="index.html">⌂<br>首页</a><a class="plus" href="publish.html">＋</a><a href="profile.html">◉<br>我的</a></nav>
</main>
<script>
const I={rent:'租借',car:'拼车',bag:'代取',shop:'代买',ticket:'票券',heart:'服务',pen:'捎物',info:'信息差'};
const defs=[['租借',['电动车','大疆','iPhone','账号'],'rent'],['拼车',['新乡东站','新乡站','考点','宝龙','大胖 / 二胖 / 三胖','其他'],'car'],['代取',['外卖','快递','饭来','印务','茶饮','小东小西'],'bag'],['代买',['校外','超市','宝龙','胖东来'],'shop'],['票券',['奶茶','餐食','健身房','演唱会'],'ticket'],['服务',['洗衣','妆造','摄像','陪练','找书'],'heart'],['捎物',['假条','充电器','文件'],'pen'],['信息差',['电话 / 微信','考试信息'],'info']];
const layout={代取:'pickup',拼车:'carpool',代买:'buy',票券:'ticket',租借:'rent',服务:'service',信息差:'info',捎物:'item'};
const cats=document.querySelector('#cats'),home=document.querySelector('#homeView'),sub=document.querySelector('#subView'),urgentTop=document.querySelector('#urgentTop'),urgentBoard=document.querySelector('#urgentBoard'),marketBoard=document.querySelector('#marketBoard'),search=document.querySelector('#search');
cats.innerHTML=defs.map((d,i)=>'<button class="cat '+layout[d[0]]+'" data-i="'+i+'"><b>'+d[0]+'</b></button>').join('');
const defaults=[['代取','帮带奶茶 / 外卖'],['拼车','新乡东站 → 学校'],['代取','帮忙打印 / 取件']];
function readPosts(){try{return JSON.parse(localStorage.getItem('campus_posts')||'[]')}catch{return[]}}
function matches(p,filter={}){const text=[p.category,p.subcategory,p.title,p.place].join(' ').toLowerCase();return(!filter.category||p.category===filter.category)&&(!filter.subcategory||p.subcategory===filter.subcategory)&&(!search.value||text.includes(search.value.trim().toLowerCase()))}
function renderBoards(filter={}){const all=readPosts(),urgent=all.filter(p=>p.intent==='seek'&&matches(p,filter)),sample={category:'租借',subcategory:'电动车',title:'周末电动车出租，电量足',price:'10',place:'西门取车 · 阿泽'};const market=[sample,...all.filter(p=>p.intent!=='seek')].filter(p=>matches(p,filter));const top=(urgent.length?urgent:defaults.map(x=>({category:x[0],subcategory:x[0],title:x[1]}))).slice(0,3);urgentTop.innerHTML=top.map(p=>'<article class="urgent-card"><strong>'+p.title+'</strong><small>'+p.category+' · 急需</small></article>').join('');urgentBoard.innerHTML=(urgent.length?urgent:defaults.map(x=>({category:x[0],subcategory:x[0],title:x[1]}))).slice(0,6).map(p=>'<article class="need-card"><strong>'+p.title+'</strong><small>'+p.category+' · '+(p.place||'校内')+'</small></article>').join('');marketBoard.innerHTML=market.slice(0,6).map(p=>'<article class="media-card"><div class="photo" style="background-image:url(https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=600&q=80)"></div><div class="copy"><h3>'+p.title+'</h3><p>'+p.category+' · '+(p.subcategory||'')+'</p><div class="price">'+(p.price?p.price+' 元':'面议')+'</div></div></article>').join('')}
function openCategory(i){const d=defs[i];document.querySelector('#subTitle').textContent=d[0];document.querySelector('#subItems').innerHTML=d[1].map(x=>'<button class="subitem">'+x+'</button>').join('');document.querySelectorAll('.subitem').forEach((item,j)=>item.onclick=()=>{home.style.display='block';sub.classList.remove('show');renderBoards({category:d[0],subcategory:d[1][j]})});home.style.display='none';sub.classList.add('show')}
document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>openCategory(Number(b.dataset.i)));document.querySelector('#back').onclick=()=>{sub.classList.remove('show');home.style.display='block';renderBoards()};search.addEventListener('input',()=>renderBoards());document.querySelector('#refreshNeeds').onclick=renderBoards;window.addEventListener('storage',renderBoards);renderBoards();
</script>
</body>
</html>
