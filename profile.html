<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的 · 校小易</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2ef;font-family:Arial,"Microsoft YaHei",sans-serif;color:#14211b}.page{max-width:430px;min-height:100vh;margin:auto;background:#f7f8f6;padding:20px 16px}.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}.back,.edit{border:0;background:#fff;border-radius:12px;width:38px;height:38px;font-size:20px}.edit{margin-left:auto;font-size:12px;color:#236b4d;width:auto;padding:0 13px}.avatar{width:64px;height:64px;border-radius:50%;background:#dff0e6;color:#236b4d;display:grid;place-items:center;font-size:24px;font-weight:900;cursor:pointer}.head{display:flex;align-items:center;gap:14px;margin-bottom:18px}.head small{display:block;color:#7d8983;margin-top:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid #e8ece9;border-radius:16px;padding:16px 8px;text-align:center}.stat b{display:block;font-size:20px;color:#236b4d}.stat span{display:block;color:#7d8983;font-size:11px;margin-top:7px}.card{background:#fff;border:1px solid #e8ece9;border-radius:18px;margin-top:14px;padding:16px}.card h2{font-size:15px;margin:0 0 8px}.line{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #e8ece9;font-size:13px}.line:last-child{border:0}.muted{color:#7d8983}.line input{border:1px solid #dce7df;border-radius:8px;padding:7px;text-align:right;width:150px;font:inherit;font-size:13px}.save{display:none;width:100%;border:0;background:#236b4d;color:#fff;border-radius:10px;padding:10px;margin-top:10px}</style><main class="page"><div class="top"><button class="back" onclick="location.href='index.html'">‹</button><button class="edit" id="edit">编辑资料</button></div><section class="head"><div class="avatar" id="avatar">林</div><div><b>我的</b><small>点击头像可更换</small></div></section><section class="stats"><div class="stat"><b>3</b><span>正在出售</span></div><div class="stat"><b>1</b><span>正在寻求</span></div><div class="stat"><b>8</b><span>交易达成</span></div></section><section class="card"><h2>我的信息</h2><div class="line"><span class="muted">姓名</span><input value="林同学" disabled></div><div class="line"><span class="muted">学号</span><input value="20****018" disabled></div><div class="line"><span class="muted">宿舍</span><input value="3号楼 521" disabled></div><button class="save" id="save">保存信息</button></section></main><script>const edit=document.querySelector('#edit'),save=document.querySelector('#save'),inputs=document.querySelectorAll('input');edit.onclick=()=>{inputs.forEach(i=>i.disabled=false);save.style.display='block';edit.style.display='none'};save.onclick=()=>{inputs.forEach(i=>i.disabled=true);save.style.display='none';edit.style.display='block'};document.querySelector('#avatar').onclick=()=>alert('头像更换功能将在登录后开放');</script>
